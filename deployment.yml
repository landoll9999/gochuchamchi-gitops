# 참고 사항 (실제 앱 코드/Dockerfile 확인 결과 반영):
# 1. 이미지: GitHub Actions가 Docker Hub(dnjstjr504/gochuchamchi)로 빌드/푸시 -> Argo CD Image
#    Updater가 새 태그를 감지해서 이 파일의 image 태그를 자동 갱신 (kustomization.yaml의
#    images: 필드를 통해 오버라이드됨 - 이 파일에 적힌 태그는 초기값일 뿐).
# 2. command: 원본 Dockerfile의 ENTRYPOINT가
#    "--spring.config.location=file:/app/config/application.yml" 를 강제로 지정하는데,
#    이 경로는 K8s에는 존재하지 않는 파일이라 그대로 두면 부팅에 실패한다.
#    command를 오버라이드해서 이 옵션 없이 순수 jar만 실행 -> classpath의 application.yml +
#    환경변수(ConfigMap/Secret)만으로 동작하게 함.
# 3. DB 자격증명은 이제 Secret으로 주입하지 않는다 (2026-08-13). 앱이 RDS IAM 토큰으로
#    붙으므로 DB 비밀번호라는 것이 존재하지 않는다 — 15분짜리 토큰을 드라이버가 접속마다
#    직접 발급받는다. DB_USER와 접속 URL은 ConfigMap(gochuchamchi-config)에서 온다.
#    Redis AUTH만 Secret(gochuchamchi-redis-secret, 키 SPRING_DATA_REDIS_PASSWORD)에서
#    주입한다 — 평문으로 git에 올리지 않음. ConfigMap/Secret/Namespace/SA는 인프라
#    Terraform이 관리한다.
# 4. 헬스체크: 프로젝트에 spring-boot-actuator 의존성이 없어서 /actuator/health가 존재하지 않음.
#    실제 존재하는 "/" (HomeController) 경로로 대체.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gochuchamchi-web
  namespace: gochuchamchi
  labels:
    app: gochuchamchi-web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: gochuchamchi-web
  template:
    metadata:
      labels:
        app: gochuchamchi-web
    spec:
      serviceAccountName: gochuchamchi-app
      # 두 복제본을 서로 다른 노드와 AZ에 최대한 분산한다. 한 노드 또는 한 AZ가
      # 내려가도 다른 위치의 Pod가 ALB 요청을 계속 처리하게 한다.
      #
      # matchLabelKeys(pod-template-hash)가 없으면 롤링 업데이트 때 종료 중인
      # 구세대 파드까지 분산 계산에 포함돼, 신세대 2개가 한 노드로 몰릴 수 있다
      # (2026-08-18 기동 직후 Image Updater 롤링에서 실제 발생 — 노드 2개인데
      # 신파드 2개가 같은 노드에 배치됨). 세대별로 따로 계산하도록 고정한다.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app: gochuchamchi-web
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app: gochuchamchi-web
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gochuchamchi-web
          image: 828885965304.dkr.ecr.ap-northeast-2.amazonaws.com/gochuchamchi:a45e6d791a007872996fd0f1c3b6d24c13939f2a
          imagePullPolicy: Always
          command: ["java", "-jar", "/app/app.jar"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: gochuchamchi-config
            # (2026-08-13) secretRef: gochuchamchi-db-app 을 제거했다.
            #   앱이 DB 에 IAM 토큰으로 붙게 되면서 DB_PASS 가 필요 없어졌는데,
            #   그대로 두면 쓰이지도 않는 DB 비밀번호가 파드 환경변수에 계속 남는다.
            #   파드가 침해되면 그대로 읽히고, 토큰과 달리 만료도 없다.
            #   ※ 이 Secret 은 인프라 저장소에서도 더 이상 만들지 않는다. 되살리려면
            #     terraform 쪽 provisioning 부터 되돌려야 한다 (contract.tf 의
            #     forbidden_refs 에 등록돼 있어 verify-contract 가 잡는다).
            - secretRef:
                name: gochuchamchi-redis-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          # startupProbe로 "기동 중"과 "죽음"을 분리한다 (2026-08-06 추가).
          # 왜 — 이 앱의 실제 기동 시간은 약 80초다(Spring 컨텍스트 48초 + OTel 자동계측
          # 에이전트 부착). 그런데 livenessProbe가 initialDelaySeconds: 40 뒤부터 검사를
          # 시작해서, 아직 부팅 중인 컨테이너를 죽여 버렸다. 재구축 당일 두 파드 모두
          # exit 143(SIGTERM)으로 재시작했고, 노드가 느리거나 이미지 pull이 길어지면
          # 기동 -> 강제종료 -> 재기동을 반복하는 크래시루프가 된다.
          #
          # startupProbe가 통과할 때까지 readiness/liveness는 아예 돌지 않으므로
          # 두 probe의 initialDelaySeconds는 필요 없어진다. 기동 예산은
          # periodSeconds × failureThreshold = 10초 × 24 = 240초로, 실측 80초의 3배를
          # 준다. 이 예산을 넘기면 그건 느린 게 아니라 정말 실패한 것이다.
          startupProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 20
