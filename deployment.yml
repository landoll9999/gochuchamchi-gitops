# 참고 사항 (실제 앱 코드/Dockerfile 확인 결과 반영):
# 1. 이미지: GitHub Actions가 Docker Hub(dnjstjr504/gochuchamchi)로 빌드/푸시 -> Argo CD Image
#    Updater가 새 태그를 감지해서 이 파일의 image 태그를 자동 갱신 (kustomization.yaml의
#    images: 필드를 통해 오버라이드됨 - 이 파일에 적힌 태그는 초기값일 뿐).
# 2. command: 원본 Dockerfile의 ENTRYPOINT가
#    "--spring.config.location=file:/app/config/application.yml" 를 강제로 지정하는데,
#    이 경로는 K8s에는 존재하지 않는 파일이라 그대로 두면 부팅에 실패한다.
#    command를 오버라이드해서 이 옵션 없이 순수 jar만 실행 -> classpath의 application.yml +
#    환경변수(ConfigMap/Secret)만으로 동작하게 함.
# 3. DB_PASS는 Secret(gochuchamchi-db-app)에서, Redis AUTH는 Secret
#    (gochuchamchi-redis-secret, 키 SPRING_DATA_REDIS_PASSWORD)에서 주입 — 평문으로 git에
#    올리지 않음. 두 Secret 모두 인프라 Terraform이 관리한다(ConfigMap/Namespace/SA도 동일).
#    ※ 이 저장소에 03-deployment-web.yml이 남아 있지만 kustomization.yaml의 resources에
#      없어서 실제로는 적용되지 않는 잔재 파일이다. 수정은 반드시 이 파일에 할 것.
# 4. 헬스체크: 프로젝트에 spring-boot-actuator 의존성이 없어서 /actuator/health가 존재하지 않음.
#    실제 존재하는 "/" (HomeController) 경로로 대체.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gochuchamchi-web
  namespace: gochuchamchi
  labels:
    app: gochuchamchi-web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: gochuchamchi-web
  template:
    metadata:
      labels:
        app: gochuchamchi-web
    spec:
      serviceAccountName: gochuchamchi-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gochuchamchi-web
          image: 828885965304.dkr.ecr.ap-northeast-2.amazonaws.com/gochuchamchi:a45e6d791a007872996fd0f1c3b6d24c13939f2a
          imagePullPolicy: Always
          command: ["java", "-jar", "/app/app.jar"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: gochuchamchi-config
            - secretRef:
                name: gochuchamchi-db-app
            - secretRef:
                name: gochuchamchi-redis-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          # startupProbe로 "기동 중"과 "죽음"을 분리한다 (2026-08-06 추가).
          # 왜 — 이 앱의 실제 기동 시간은 약 80초다(Spring 컨텍스트 48초 + OTel 자동계측
          # 에이전트 부착). 그런데 livenessProbe가 initialDelaySeconds: 40 뒤부터 검사를
          # 시작해서, 아직 부팅 중인 컨테이너를 죽여 버렸다. 재구축 당일 두 파드 모두
          # exit 143(SIGTERM)으로 재시작했고, 노드가 느리거나 이미지 pull이 길어지면
          # 기동 -> 강제종료 -> 재기동을 반복하는 크래시루프가 된다.
          #
          # startupProbe가 통과할 때까지 readiness/liveness는 아예 돌지 않으므로
          # 두 probe의 initialDelaySeconds는 필요 없어진다. 기동 예산은
          # periodSeconds × failureThreshold = 10초 × 24 = 240초로, 실측 80초의 3배를
          # 준다. 이 예산을 넘기면 그건 느린 게 아니라 정말 실패한 것이다.
          startupProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 20
