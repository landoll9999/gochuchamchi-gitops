# ArgoCD 파이프라인 동작 확인용 임시 테스트 리소스 - 확인 후 삭제 예정
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-test-nginx
  namespace: gochuchamchi
  labels:
    app: argocd-test-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argocd-test-nginx
  template:
    metadata:
      labels:
        app: argocd-test-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
